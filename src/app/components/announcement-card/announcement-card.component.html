<div
    class=" relative w-full max-w-[360px] mx-auto bg-white shadow-sm  rounded-lg shadow-sm hover:shadow-2xl transition duration-300">
    <a [routerLink]="['/announce',announcement.id]">
        <img [src]=" 'http://localhost:8000/storage/'+ announcement.photos[0].url" alt="" />

    </a>
    <p class="absolute top-3 right-2 text-white text-xs bg-[#FF9000] p-2 rounded-xl"> {{ announcement.operation_type }}
    </p>

    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
        class="size-6 absolute top-65 text-[#FF9000] bg-white  w-[35px] p-1  rounded-lg right-2">
        <path stroke-linecap="round" stroke-linejoin="round"
            d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" />
    </svg>

    <div class="p-5">


        <a href="#">
            <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-black">
                {{ announcement.title}}
            </h5>
        </a>
        <div class="flex">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6 text-[#6b7280]">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
            </svg>

            <p class="mb-3 font-normal text-[#6b7280] dark:text-gray-400">
                {{ announcement.exchange_location_address }}
            </p>
        </div>

        <div class="flex justify-between">
            <p href="#"
                class="inline-flex items-center px-3 py-2 text-sm font-bold text-center text-[#FF9000]   rounded-lg focus:outline-none focus:ring-blue-300  dark:focus:ring-blue-800">
                {{
                announcement.operation_type === "don"
                ? "Gratuit"
                : announcement.operation_type === "exchange"
                ? "Echange"
                
                : (announcement.price +" $ ")
                
                }}
            </p>
            <p class="text-[#6b7280]">
                {{ announcement.created_at}}
            </p>
        </div>
    </div>
</div>
