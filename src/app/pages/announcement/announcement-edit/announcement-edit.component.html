<app-header></app-header>

<!-- Affichage du toast avec le message d'erreur ou de succès -->
<div *ngIf="showToast" class="fixed top-0 left-0 w-full z-50 flex justify-center">
  <div [ngClass]="{
      'bg-green-500': toastType === 'success',
      'bg-red-500': toastType === 'error'
    }"
    class="text-white px-6 py-3 rounded-b shadow-md w-full max-w-md mx-auto flex justify-between items-center animate-slide-down">
    <p class="text-lg text-center font-semibold">{{ toastMessage }}</p>
    <a [routerLink]="['']">❌</a>
  </div>
</div>

<div class="w-full max-w-4xl mx-auto shadow-xl rounded-xl mt-10 px-4">
  <!-- En-tête orange -->
  <div class="flex flex-col items-center justify-center bg-[#FF9000] p-8 sm:p-10 rounded-t-xl text-center">
    <p class="text-white text-xl font-bold">Modification de l'annonce</p>
  </div>

  <div class="w-full mb-8 p-4 sm:p-6 space-y-8">
    <form [formGroup]="announcementForm" (ngSubmit)="onSubmit()">
      
      <!-- Type de l'annonce -->
      <div class="space-y-4">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-orange-500 text-white rounded-full flex items-center justify-center font-bold text-sm">1</div>
          <h2 class="text-xl font-semibold text-gray-900">Type de l'annonce</h2>
        </div>
        <select id="state" formControlName="operation_type"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-orange-500 focus:outline-none">
          <option value="" disabled>Sélectionner le type de l'annonce</option>
          <option value="don">Don 🎁</option>
          <option value="exchange">Échange 💱</option>
          <option value="sale">Vente 🛒</option>
        </select>
        <div *ngIf="isSubmited && announcementForm.get('operation_type')?.errors?.['required']"
          class="text-red-500 text-sm">Champ obligatoire</div>
      </div>

      <!-- Informations générales -->
      <div class="space-y-4">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-orange-500 text-white rounded-full flex items-center justify-center font-bold text-sm">2</div>
          <h2 class="text-xl font-semibold text-gray-900">Information générale</h2>
        </div>

        <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm space-y-4">
          <div>
            <label for="title" class="block text-sm font-medium mb-1">Titre de l'annonce</label>
            <input id="title" type="text" formControlName="title" placeholder="Ex: Livre de mathématique 6ème"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-orange-500 focus:outline-none" />
            <div *ngIf="isSubmited && announcementForm.get('title')?.errors?.['required']"
              class="text-red-500 text-sm">Le titre est requis</div>
          </div>

          <div>
            <label for="description" class="block text-sm font-medium mb-1">Description</label>
            <textarea id="description" rows="4" formControlName="description"
              placeholder="Faites une description de votre article"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-orange-500 focus:outline-none resize-none"></textarea>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label for="category_id" class="block text-sm font-medium mb-1">Catégorie</label>
              <select id="category_id" formControlName="category_id"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-orange-500 focus:outline-none">
                <option value="" disabled>Sélectionner une catégorie</option>
                <option *ngFor="let category of categories" [value]="category.id">{{ category.name }}</option>
              </select>
              <div *ngIf="isSubmited && announcementForm.get('category_id')?.errors?.['required']"
                class="text-red-500 text-sm">La catégorie est requise</div>
            </div>

            <div *ngIf="announcementForm.get('operation_type')?.value === 'sale'">
              <label for="price" class="block text-sm font-medium mb-1">Prix</label>
              <input id="price" type="number" formControlName="price" placeholder="Ex: 10000"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-orange-500 focus:outline-none" />
            </div>

            <div class="md:col-span-2">
              <label for="state" class="block text-sm font-medium mb-1">État</label>
              <select id="state" formControlName="state"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-orange-500 focus:outline-none">
                <option value="" disabled>-- Sélectionner l'état de votre article --</option>
                <option value="new">Neuf</option>
                <option value="like new">En bon état</option>
                <option value="good">Comme neuf</option>
                <option value="gamaged">Abîmé</option>
              </select>
              <div *ngIf="isSubmited && announcementForm.get('state')?.errors?.['required']"
                class="text-red-500 text-sm">L'état est requis</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Lieu d'échange -->
      <div class="space-y-4">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-orange-500 text-white rounded-full flex items-center justify-center font-bold text-sm">4</div>
          <h2 class="text-xl font-semibold text-gray-900">Lieu d'échange</h2>
        </div>

        <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm space-y-4">
          <div>
            <label for="exchangeAddress" class="block text-sm font-medium mb-1">Adresse d'échange</label>
            <input id="exchangeAddress" formControlName="exchange_location_address" (input)="onAddressInput()" placeholder="Adresse"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-orange-500 focus:outline-none" />
            <ul *ngIf="addressSuggestions.length" class="bg-white border mt-2 rounded shadow-sm max-h-40 overflow-y-auto text-sm">
              <li *ngFor="let suggestion of addressSuggestions" (click)="selectAddress(suggestion)" class="p-2 hover:bg-gray-100 cursor-pointer">
                {{ suggestion.display_name }}
              </li>
            </ul>
            <div *ngIf="isSubmited && announcementForm.get('exchange_location_address')?.errors?.['required']"
              class="text-red-500 text-sm">Veuillez renseigner le lieu</div>
          </div>

          <input formControlName="exchange_location_lat" type="text" hidden />
          <input formControlName="exchange_location_lng" type="text" hidden />
        </div>

        <!-- Carte -->
        <div id="map" class="w-full h-[400px] mt-2 rounded-md overflow-hidden"></div>
      </div>

      <!-- Boutons -->
      <div class="pt-4 flex flex-col sm:flex-row gap-3">
        <button type="submit"
          class="w-full sm:w-auto px-6 py-2 bg-orange-500 text-white rounded-md hover:bg-orange-600 focus:outline-none focus:ring-orange-500">
          Publier l'annonce
        </button>
        <a [routerLink]="['']"
          class="w-full sm:w-auto px-6 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-100 focus:outline-none focus:ring-gray-500">
          Annuler
        </a>
      </div>
    </form>
  </div>
</div>

<app-footer></app-footer>
