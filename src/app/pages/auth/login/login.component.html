<!-- Conteneur principal centré -->
<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md overflow-hidden rounded-lg shadow-lg bg-white">
    <!-- Header avec couleur orange -->
    <div class="bg-[#ff9000] p-6 text-center text-white">
      <div class="flex justify-center mb-4">
        <div class="bg-white/20 p-3 rounded-full">
          <!-- Icône de livre -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-8 w-8"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
            />
          </svg>
        </div>
      </div>
      <h1 class="text-2xl font-bold">Bienvenue sur SchoolCycle</h1>
      <p class="mt-2">Connectez-vous pour accéder à votre compte</p>
    </div>

    <!-- Formulaire de connexion -->
    <div class="p-6">
      <form>
        <div class="space-y-4">
          <!-- Email -->
          <div class="space-y-2">
            <label for="email" class="text-sm font-medium block"> Email </label>
            <input
              id="email"
              placeholder="nom@exemple.fr"
              type="email"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#ff9000] focus:border-[#ff9000]"
            />
          </div>

          <!-- Mot de passe -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label for="password" class="text-sm font-medium">
                Mot de passe
              </label>
              <a href="#" class="text-sm text-[#ff9000] hover:text-[#e68200]">
                Mot de passe oublié?
              </a>
            </div>
            <input
              id="password"
              type="password"
              value="••••••••"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#ff9000] focus:border-[#ff9000]"
            />
          </div>

          <!-- Se souvenir de moi -->
          <div class="flex items-center space-x-2">
            <input
              type="checkbox"
              id="remember"
              class="h-4 w-4 text-[#ff9000] border-gray-300 rounded focus:ring-[#ff9000]"
            />
            <label for="remember" class="text-sm font-medium">
              Se souvenir de moi
            </label>
          </div>

          <!-- Bouton de connexion -->
          <button
            type="submit"
            class="w-full bg-[#ff9000] hover:bg-[#e68200] text-white py-2 px-4 rounded-md transition-colors"
          >
            Se connecter
          </button>
        </div>
      </form>

      <!-- Séparateur -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-white text-gray-500">Ou</span>
        </div>
      </div>

      <!-- Lien d'inscription -->
      <div class="mt-6 text-center text-sm">
        <span class="text-gray-600">Vous n'avez pas de compte? </span>
        <a href="#" class="text-[#ff9000] hover:text-[#e68200] font-medium">
          S'inscrire
        </a>
      </div>
    </div>
  </div>
</div>
