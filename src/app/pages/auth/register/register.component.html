<!-- Conteneur principal centré -->
<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
    
  <div class="w-full max-w-md overflow-hidden rounded-lg shadow-lg bg-white">
    <!-- Header avec couleur orange -->
    <div class="bg-[#ff9000] p-6 text-center text-white">
      <div class="flex justify-center mb-4">
        <div class="bg-white/20 p-3 rounded-full">
          <!-- Icône de livre -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
      </div>
      <h1 class="text-2xl font-bold">Rejoignez SchoolCycle</h1>
      <p class="mt-2">Créez votre compte pour échanger, vendre ou donner des fournitures scolaires</p>
    </div>

    <!-- Formulaire d'inscription -->
    <div class="p-6">
      <form>
        <div class="space-y-4">
          <!-- Prénom et Nom -->
          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
              <label for="prenom" class="text-sm font-medium block">
                Prénom
              </label>
              <input id="prenom" placeholder="Prénom" type="text" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#ff9000] focus:border-[#ff9000]">
            </div>
            <div class="space-y-2">
              <label for="nom" class="text-sm font-medium block">
                Nom
              </label>
              <input id="nom" placeholder="Nom" type="text" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#ff9000] focus:border-[#ff9000]">
            </div>
          </div>

          <!-- Email -->
          <div class="space-y-2">
            <label for="email" class="text-sm font-medium block">
              Email
            </label>
            <input id="email" placeholder="nom@exemple.fr" type="email" 
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#ff9000] focus:border-[#ff9000]">
          </div>

          <!-- Mot de passe et Confirmation -->
          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
              <label for="password" class="text-sm font-medium block">
                Mot de passe
              </label>
              <input id="password" type="password" placeholder="••••••••"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#ff9000] focus:border-[#ff9000]">
            </div>
            <div class="space-y-2">
              <label for="confirm-password" class="text-sm font-medium block">
                Confirmer le mot de passe
              </label>
              <input id="confirm-password" type="password" placeholder="••••••••"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#ff9000] focus:border-[#ff9000]">
            </div>
          </div>

          <!-- Conditions d'utilisation -->
          <div class="flex items-center space-x-2">
            <input type="checkbox" id="terms" class="h-4 w-4 text-[#ff9000] border-gray-300 rounded focus:ring-[#ff9000]">
            <label for="terms" class="text-sm">
              J'accepte les <a href="#" class="text-[#ff9000] hover:text-[#e68200]">conditions d'utilisation</a> et la <a href="#" class="text-[#ff9000] hover:text-[#e68200]">politique de confidentialité</a>
            </label>
          </div>

          <!-- Bouton d'inscription -->
          <button type="submit" class="w-full bg-[#ff9000] hover:bg-[#e68200] text-white py-2 px-4 rounded-md transition-colors">
            Créer mon compte
          </button>
        </div>
      </form>

      <!-- Lien de connexion -->
      <div class="mt-6 text-center text-sm">
        <span class="text-gray-600">Vous avez déjà un compte? </span>
        <a href="#" class="text-[#ff9000] hover:text-[#e68200] font-medium">
          Se connecter
        </a>
      </div>
    </div>
  </div>
</div>
