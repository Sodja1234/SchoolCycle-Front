<!-- Conteneur principal centré -->
<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md overflow-hidden rounded-lg shadow-lg bg-white">
    <!-- Header avec couleur orange -->
    <div class="bg-[#ff9000] p-6 text-center text-white">
      <div class="flex justify-center mb-4">
        <div class="bg-white/20 p-3 rounded-full">
          <!-- Icône de livre -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-8 w-8"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
            />
          </svg>
        </div>
      </div>
      <h1 class="text-2xl font-bold">Créer un nouveau mot de passe</h1>
      <p class="mt-2">
        Veuillez entrer et confirmer votre nouveau mot de passe
      </p>
    </div>

    <!-- Formulaire de nouveau mot de passe -->
    <div class="p-6">
      <form>
        <div class="space-y-4">
          <!-- Nouveau mot de passe -->
          <div class="space-y-2">
            <label for="new-password" class="text-sm font-medium block">
              Nouveau mot de passe
            </label>
            <input
              id="new-password"
              type="password"
              placeholder="••••••••"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#ff9000] focus:border-[#ff9000]"
            />
            <p class="text-xs text-gray-500 mt-1">
              Le mot de passe doit contenir au moins 8 caractères
            </p>
          </div>

          <!-- Confirmer le mot de passe -->
          <div class="space-y-2">
            <label for="confirm-password" class="text-sm font-medium block">
              Confirmer le mot de passe
            </label>
            <input
              id="confirm-password"
              type="password"
              placeholder="••••••••"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#ff9000] focus:border-[#ff9000]"
            />
          </div>

          <!-- Bouton de confirmation -->
          <button
            type="submit"
            class="w-full bg-[#ff9000] hover:bg-[#e68200] text-white py-2 px-4 rounded-md transition-colors"
          >
            Enregistrer le nouveau mot de passe
          </button>
        </div>
      </form>

      <!-- Lien de retour -->
      <div class="mt-6 text-center text-sm">
        <a href="#" class="text-[#ff9000] hover:text-[#e68200] font-medium">
          Retour à la connexion
        </a>
      </div>
    </div>
  </div>
</div>
