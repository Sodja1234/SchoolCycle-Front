<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12">
  <div class="max-w-md w-full text-center bg-white rounded-xl shadow-2xl overflow-hidden transform transition-all duration-500 hover:shadow-3xl">
    <!-- Illustration -->
    <div class="bg-gradient-to-r from-[#FF9000] to-[#FFAC1C] p-8">
      <div class="mx-auto w-48 h-48 relative">
        <svg class="w-full h-full text-white animate-bounce" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="absolute top-0 right-0 -mt-4 -mr-4 bg-white text-[#FF9000] rounded-full w-12 h-12 flex items-center justify-center text-2xl font-bold shadow-md animate-pulse">
          404
        </span>
      </div>
    </div>

    <!-- Contenu -->
    <div class="px-8 py-10">
      <!-- Titre -->
      <h1 class="text-4xl font-extrabold text-gray-900 mb-3 animate-fade-in">
        Annonce introuvable
      </h1>

      <!-- Séparateur -->
      <div class="w-20 h-1 bg-[#FF9000] mx-auto mb-6 rounded-full"></div>

      <!-- Message -->
      <p class="text-lg text-gray-600 mb-8 leading-relaxed animate-fade-in-delay">
        L'article que vous recherchez a peut-être été déplacé ou supprimé.
        <br>
        Voici quelques alternatives pour continuer votre navigation :
      </p>

      <!-- Boutons d'action -->
      <div class="space-y-4 animate-fade-in-delay-2">
        <a
          [routerLink]="['/announcement-gallery']"
          class="inline-flex items-center justify-center w-full px-6 py-4 bg-[#FF9000] text-white font-semibold rounded-lg hover:bg-[#FFAC1C] transition-all duration-300 transform hover:-translate-y-1 shadow-md hover:shadow-lg"
        >
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
          Explorer les annonces
        </a>

        <a
          [routerLink]="['/']"
          class="inline-flex items-center justify-center w-full px-6 py-3 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 transition-all duration-300"
        >
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Retour à l'accueil
        </a>
      </div>
    </div>
  </div>
</div>
