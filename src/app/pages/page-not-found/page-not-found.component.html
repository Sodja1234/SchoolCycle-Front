<div class="min-h-screen flex items-center justify-center bg-white px-4 py-12">
  <div class="max-w-md w-full text-center bg-gradient-to-br from-white to-gray-50 rounded-2xl shadow-xl overflow-hidden transform transition-all duration-300 hover:shadow-2xl">
    <!-- Illustration animée -->
    <div class="px-8 pt-10">
      <div class="relative mx-auto w-40 h-40">
        <div class="absolute inset-0 bg-[#ff9000] rounded-full opacity-10 animate-pulse"></div>
        <svg class="relative w-full h-full text-[#ff9000] animate-float" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
    </div>

    <!-- Contenu -->
    <div class="px-8 pb-10">
      <!-- Titre avec animation -->
      <div class="mb-4 animate-fade-in-up">
        <h1 class="text-7xl font-black text-[#ff9000] mb-2">404</h1>
        <div class="w-16 h-1.5 bg-[#ff9000] mx-auto rounded-full opacity-80"></div>
      </div>

      <!-- Message -->
      <div class="mb-8 animate-fade-in-up delay-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-3">Oups ! Page introuvable</h2>
        <p class="text-gray-600 leading-relaxed">
          La page que vous recherchez semble avoir disparu dans les méandres du web.
          <br>
          Ne vous inquiétez pas, nous allons vous ramener en sécurité !
        </p>
      </div>

      <!-- Bouton d'action amélioré -->
      <div class="animate-fade-in-up delay-200">
        <a
          [routerLink]="['']"
          class="inline-flex items-center justify-center w-full px-6 py-3.5 bg-[#ff9000] text-white font-semibold rounded-lg hover:bg-[#e68200] transition-all duration-300 transform hover:-translate-y-0.5 shadow-md hover:shadow-lg"
        >
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Retour à l'accueil
        </a>
      </div>
    </div>
  </div>
</div>
