<div class="w-full md:w-64 flex justify-center items-center">
    <div class="w-full flex flex-col justify-start bg-white rounded-lg shadow-md overflow-hidden">
        <!-- Bannière -->
        <div class="h-12 md:h-16 bg-orange-custom" style="background-color: #ff9000;"></div>

        <div class="relative w-16 h-16 md:w-20 md:h-20 mx-auto -mt-8 md:-mt-10 mb-3">
            <img 
              *ngIf="profile?.avatar" 
              [src]="profile.avatar" 
              alt="Avatar utilisateur"
              class="w-full h-full object-cover rounded-full border-4 border-white bg-gray-200" />
            <div *ngIf="!profile?.avatar" class="w-full h-full rounded-full bg-gray-200 border-4 border-white"></div>
          </div>

            <!-- Informations du profil -->
            @if (userInfo.length == 0) {
                <div class="p-4 text-center">
                    pas d'info dispo
                </div>
            } @else {
                <div class="text-center px-2 md:px-0">
                    <h2 class="text-md md:text-lg font-bold text-gray-800">{{userInfo[0].created_by.name}}</h2>

                    <!-- Note -->
                    <div class="flex items-center justify-center mb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 text-yellow-400 mr-1">
                            <path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" clip-rule="evenodd" />
                        </svg>
                    </div>

                    <!-- Tags -->
                    <div class="flex flex-wrap justify-center gap-2 mb-3">
                    </div>

                    <!-- Bio -->
                    <p class="text-gray-700 font-bold text-xs leading-relaxed mb-4 px-3 md:p-5">
                        {{profile?.bio}}
                       
                    </p>
                   
                    <!-- Informations de contact -->
                    <div class="border-t border-b border-gray-200 px-3 py-3 md:p-5 mb-4 text">
                        <a href="mailto:alex@exemple.fr" class="flex items-center text-gray-600 text-xs mb-2 hover:text-orange-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2 flex-shrink-0">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <span class="truncate">{{userInfo[0].created_by.email}}</span>
                        </a>
                        <a href="tel:0612345678" class="flex items-center text-gray-600 text-xs mb-2 hover:text-orange-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2 flex-shrink-0">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                            <span>{{profile?.telephone}}</span>
                        </a>
                        <div class="flex items-center text-gray-600 text-xs mb-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 w-4 h-4 mr-2 flex-shrink-0">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                            </svg>
                            <span class="truncate">{{ profile?.adresse }}</span>
                        </div>
                        <div class="flex items-center text-gray-600 text-xs">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2 flex-shrink-0">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                            <span class="truncate">Membre depuis {{userInfo[0].created_by.created_at}}</span>
                        </div>
                    </div>
                    <!-- Bouton modifier profil -->
                    <a *ngIf="isOwner" [routerLink]="['/user-setting']" class="flex items-center justify-center py-2 border rounded text-gray-700 text-xs hover:bg-gray-50 transition-colors mx-2 mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                        Modifier le profil
                    </a>
                </div>
            }
        </div>
    </div>

<div class="mt-6 md:mt-12">
    <app-action-rapide></app-action-rapide>
</div>
