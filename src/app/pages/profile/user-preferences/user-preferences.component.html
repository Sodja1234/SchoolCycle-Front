<div class="w-full mx-auto bg-white rounded-xl shadow p-6">
  <div class="mt-6 space-y-6">
    <div>
      <h2 class="text-orange-600 font-semibold mb-2">Catégories de fournitures préférées</h2>

      <label class="block text-sm mb-1">Ajouter des catégories de fournitures</label>
      <div class="flex items-center gap-2 mb-2">
        <select [(ngModel)]="selectedCategoryId" class="flex-1 border rounded px-3 py-2 text-sm">
          <option value="" disabled selected>Sélectionner une catégorie</option>
          <option *ngFor="let category of categories" [value]="category.id.toString()">
            {{ category.name }}
          </option>
        </select>
        <button (click)="onAddCategory()" class="bg-orange-500 text-white px-4 py-2 rounded">
          + Ajouter
        </button>
      </div>

      <p class="text-xs text-gray-500 mb-2">
        Ces catégories seront utilisées pour vous suggérer des annonces qui correspondent à vos intérêts.
      </p>

      <div class="flex flex-wrap gap-2 p-2 bg-white rounded border min-h-[40px]">
        <span *ngFor="let cat of favoriteCategories" class="text-orange-700 px-3 py-1 rounded-full text-sm font-medium bg-orange-100 flex items-center gap-2">
          <img *ngIf="cat.photo" [src]="cat.photo" alt="{{cat.name}}" width="24" height="24" class="rounded-full object-cover" />
          <div class="flex flex-col">
            <span>{{ cat.name }}</span>
            <small class="text-gray-500">{{ cat.description }}</small>
          </div>
          <button (click)="removeCategory(cat)" class="text-orange-700 hover:text-orange-900 font-bold">&times;</button>
        </span>
        <span *ngIf="favoriteCategories.length === 0" class="text-gray-400 text-sm italic">
          Aucune catégorie préférée ajoutée.
        </span>
      </div>
    </div>

    <div class="flex justify-end space-x-4 pt-4">
      <button (click)="onCancel()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2"
              style="--tw-ring-color: #ff9000;">Annuler</button>
      <button (click)="onSave()" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded font-semibold"
              style="--tw-ring-color: #ff9000;">
        Enregistrer
      </button>
    </div>
  </div>
</div>
