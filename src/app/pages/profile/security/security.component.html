<form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
    <div class="bg-white rounded-lg p-4 sm:p-5 mb-6">
      <h2 class="text-lg sm:text-xl font-bold text-gray-800 mb-4">Changer de mot de passe</h2>
      
      <div class="space-y-4">
        <!-- Mot de passe actuel -->
        <div>
          <label for="old_password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe actuel</label>
          <input 
            type="password" 
            id="old_password" 
            formControlName="old_password"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:border-transparent" 
            style="--tw-ring-color: #ff9000;"
          >
          <div *ngIf="passwordForm.get('old_password')?.invalid && passwordForm.get('old_password')?.touched" class="text-red-600 text-xs">
            Le mot de passe actuel est requis.
          </div>
        </div>
        
        <!-- Nouveau mot de passe et confirmation -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="new_password" class="block text-sm font-medium text-gray-700 mb-1">Nouveau mot de passe</label>
            <input 
              type="password" 
              id="new_password" 
              formControlName="new_password"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:border-transparent" 
              style="--tw-ring-color: #ff9000;"
            >
            <div *ngIf="passwordForm.get('new_password')?.invalid && passwordForm.get('new_password')?.touched" class="text-red-600 text-xs">
              Le nouveau mot de passe est requis.
            </div>
          </div>
          <div>
            <label for="password_confirmation" class="block text-sm font-medium text-gray-700 mb-1">Confirmer le mot de passe</label>
            <input 
              type="password" 
              id="password_confirmation" 
              formControlName="password_confirmation"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:border-transparent" 
              style="--tw-ring-color: #ff9000;"
            >
            <div *ngIf="passwordForm.get('password_confirmation')?.invalid && passwordForm.get('password_confirmation')?.touched" class="text-red-600 text-xs">
              La confirmation du mot de passe est requise.
            </div>
          </div>
        </div>
        
        <p class="text-xs text-gray-500">Laissez ces champs vides si vous ne souhaitez pas changer votre mot de passe.</p>
      </div>
    </div>
    
    <!-- Boutons d'action -->
    <div class="border-t border-gray-200 p-4 sm:p-6 flex justify-end space-x-3">
      <button 
        type="button" 
        class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2" 
        style="--tw-ring-color: #ff9000;" 
        (click)="onCancel()">
        Annuler
      </button>
      <button 
        type="submit"
        class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2" 
        style="background-color: #ff9000; --tw-ring-color: #ff9000;">
        Enregistrer les modifications
      </button>
    </div>
  </form>
