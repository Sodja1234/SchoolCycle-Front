<div class="flex flex-wrap items-center justify-between border-b border-orange-300 mb-4 text-xs md:text-sm gap-1.5">

  <!-- </div> -->
    <div class="flex flex-wrap  w-full flex justify-between items-center justify-between  mb-2 ">
        <h3 class="text-2xl">Mes annonces</h3>
  </div>
  @if (isOwner) {
    <div class="w-full  grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 mt-10  mb-16">
      @for(announce of announcements; track announce.id){
         <app-announcement-card [announcement]="announce"> </app-announcement-card>
  }

  </div>
  }@else {
    <div class="w-full  grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 mt-10  mb-16">
      @for(announce of  userAnnouncement; track announce.id){
         <app-announcement-card [announcement]="announce"> </app-announcement-card>
  }

  </div>
  }

</div>
