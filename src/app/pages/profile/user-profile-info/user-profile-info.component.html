<form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="max-w-4xl mx-auto p-6">
  <div class="p-6 space-y-6">
    <!-- Avatar avec icône upload -->
    <div class="text-center">
      <div
        class="relative inline-block w-20 h-20 bg-gray-200 rounded-full"
        [style.backgroundImage]="'url(' + avatarUrl + ')'"
        style="background-size: cover; background-position: center;"
      >
        <label
          for="avatarInput"
          class="absolute bottom-0 right-0 bg-white border border-gray-300 rounded-full p-1 cursor-pointer hover:bg-gray-100"
          title="Changer la photo de profil"
          style="transform: translate(25%, 25%)"
        >
          <!-- icône SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"
            />
          </svg>
        </label>
        <input id="avatarInput" type="file" accept="image/*" (change)="onFileChange($event)" class="hidden" />
      </div>
      <p class="text-sm text-gray-500 mt-2">Cliquez sur l'icône pour changer votre photo de profil</p>
    </div>

    <!-- Nom complet et téléphone -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Nom complet</label>
        <input id="name" type="text" formControlName="name" class="mt-1 block w-full border rounded p-2" />
      </div>

      <div>
        <label for="telephone" class="block text-sm font-medium text-gray-700">Téléphone (optionnel)</label>
        <input id="telephone" type="text" formControlName="telephone" class="mt-1 block w-full border rounded p-2" />
      </div>
    </div>

    <!-- Bio -->
    <div>
      <label for="bio" class="block text-sm font-medium text-gray-700">Bio</label>
      <textarea id="bio" formControlName="bio" rows="3" class="mt-1 block w-full border rounded p-2"></textarea>
      <p class="text-sm text-gray-500 mt-1">
        Votre bio sera visible sur votre profil public. Partagez vos intérêts, ce que vous recherchez, etc.
      </p>
    </div>

    <!-- Profession -->
    <div>
      <label for="profession" class="block text-sm font-medium text-gray-700">Profession</label>
      <input id="profession" type="text" formControlName="profession" class="mt-1 block w-full border rounded p-2" />
    </div>

    <!-- Adresse -->
    <div>
      <label for="adresse" class="block text-sm font-medium text-gray-700">Adresse</label>
      <input id="adresse" type="text" formControlName="adresse" class="mt-1 block w-full border rounded p-2" />
      <p class="text-sm text-gray-500 mt-1">
        Votre adresse ne sera jamais partagée publiquement. Elle est utilisée uniquement pour vous suggérer des annonces à proximité.</p>
  <!-- Boutons -->
  <div class="flex justify-end space-x-4 pt-4 border-t">
    <button type="button" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2" (click)="profileForm.reset()">Annuler</button>
    <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2" 
    style="background-color: #ff9000; --tw-ring-color: #ff9000;">Enregistrer les modifications</button>
  </div>
</div>
