<!-- Zone d'input -->
<div class="p-4 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
  
  <!-- Message d'état si le chat est fermé -->
  <div *ngIf="isChatClosed" class="mb-4 p-3 bg-gray-100 dark:bg-gray-700 rounded-lg border border-gray-200 dark:border-gray-600">
    <div class="flex items-center">
      <svg class="w-5 h-5 text-gray-500 dark:text-gray-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z" />
      </svg>
      <span class="text-sm text-gray-700 dark:text-gray-300">
        Cette conversation est fermée. Vous ne pouvez plus envoyer de messages.
      </span>
    </div>
  </div>

  <!-- Message si aucune conversation n'est sélectionnée -->
  <div *ngIf="!conversation" class="mb-4 p-3 bg-orange-50 dark:bg-orange-900/20 rounded-lg border border-orange-200 dark:border-orange-800">
    <div class="flex items-center">
      <svg class="w-5 h-5 text-orange-500 dark:text-orange-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span class="text-sm text-orange-700 dark:text-orange-300">
        Sélectionnez une conversation pour commencer à discuter
      </span>
    </div>
  </div>

  <!-- Formulaire d'envoi -->
  <form 
    *ngIf="conversation && !isChatClosed"
    (ngSubmit)="sendMessage()" 
    class="flex items-end space-x-3">
    
    <!-- Zone de texte -->
    <div class="flex-1 relative">
              <textarea
          [(ngModel)]="messageContent"
          name="messageContent"
          placeholder="Tapez votre message..."
          rows="1"
          (input)="adjustTextareaHeight($event)"
          (keydown.enter)="onEnterPress($event)"
          class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-2xl bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 resize-none overflow-hidden chat-focus"
          [class.opacity-50]="isSending"
          [disabled]="isSending">
        </textarea>
    </div>

    <!-- Bouton d'envoi -->
    <button
      type="submit"
      [disabled]="!messageContent.trim() || isSending"
      class="flex-shrink-0 w-12 h-12 bg-orange-600 hover:bg-orange-700 disabled:bg-gray-300 dark:disabled:bg-gray-600 disabled:cursor-not-allowed text-white rounded-full flex items-center justify-center transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500"
      [class.send-button-pulse]="isSending"
      title="Envoyer le message">
      
      <!-- Icône d'envoi -->
      <svg *ngIf="!isSending" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
      </svg>
      
      <!-- Spinner de chargement -->
      <svg *ngIf="isSending" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    </button>
  </form>
</div>
