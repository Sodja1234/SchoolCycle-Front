<!-- Container principal -->
<div class="flex h-screen bg-gray-50 dark:bg-gray-900 chat-container">

  <!-- Sidebar - Liste des conversations -->
  <div class="hidden lg:flex lg:w-80 xl:w-96 flex-col bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 chat-transition">
      <!-- Bouton Retour minimaliste -->
  <div class="px-4 py-3">
    <a (click)="goToHome()"
      class="text-sm font-medium text-orange-600 hover:text-orange-500 dark:text-orange-400 dark:hover:text-orange-300 transition-colors inline-flex items-center cursor-pointer">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Accueil
    </a>
  </div>

    <!-- En-tête de la sidebar -->
    <div class="p-4 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
      <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Messages</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Vos conversations</p>
    </div>

    <!-- Barre de recherche -->
    <div class="p-4 border-b border-gray-200 dark:border-gray-700">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <input
          type="search"
          placeholder="Rechercher une conversation..."
          class="block w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 chat-focus"
        />
      </div>
    </div>

    <!-- Liste des conversations -->
    <div class="flex-1 overflow-y-auto chat-scrollbar">
      <app-chat-list [userId]="userId!" (chatSelected)="onChatSelected($event)"></app-chat-list>
    </div>
  </div>

  <!-- Zone principale de chat -->
  <div class="flex-1 flex flex-col bg-white dark:bg-gray-800 chat-transition">

    <!-- En-tête du chat -->
    <app-chat-header
      [userId]="userId!"
      [chat]="selectedchat"
      (chatClosed)="onChatClosed()"
      (openInfo)="openInfoPanel()"
      class="border-b border-gray-200 dark:border-gray-700">
    </app-chat-header>

    <!-- Zone des messages -->
    <div class="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-900 chat-scrollbar">
      <app-chat-message
        [pendingMessages]="pendingMessages"
        (retry)="retryPendingMessages($event)"
        [chat]="selectedchat">
      </app-chat-message>
    </div>

    <!-- Zone d'input -->
    <div class="border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
      <app-chat-input
        class="w-full"
        [conversation]="selectedchat?.id"
        [isChatClosed]="selectedchat?.is_closed || false"
        (messageSent)="refreshMessage()"
        (pendingMessagesChange)="onPendingMessagesChange($event)">
      </app-chat-input>
    </div>
  </div>

  <!-- Overlay pour mobile - afficher la liste des chats -->
  <div *ngIf="!selectedchat" class="lg:hidden flex-1 flex items-center justify-center bg-gray-50 dark:bg-gray-900">
    <div class="text-center">
      <div class="w-16 h-16 mx-auto mb-4 bg-orange-100 dark:bg-orange-900 rounded-full flex items-center justify-center">
        <svg class="w-8 h-8 text-orange-600 dark:text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
      </div>
      <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">Sélectionnez une conversation</h3>
      <p class="text-gray-500 dark:text-gray-400">Choisissez une conversation pour commencer à discuter</p>
    </div>
  </div>

  <!-- Panneau latéral d'info chat -->
  <app-chat-info
    *ngIf="showInfoPanel && selectedchat"
    [chatId]="selectedchat.id"
    (close)="closeInfoPanel()">
  </app-chat-info>
</div>
