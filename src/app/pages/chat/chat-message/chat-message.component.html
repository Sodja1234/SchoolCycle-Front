<!-- Zone des messages -->
<div class="flex-1 overflow-y-auto p-4 space-y-4" *ngIf="chat && userId">
  
  <!-- Messages -->
  <div *ngFor="let message of chat.messages" class="flex message-enter">
    
    <!-- Message envoyé par l'utilisateur connecté -->
    <div *ngIf="message.sender.id === userId" class="flex-1 flex justify-end">
      <div class="max-w-xs lg:max-w-md">
        <div class="bg-orange-600 text-white px-4 py-2 rounded-2xl rounded-br-md shadow-sm message-bubble sent">
          <p class="text-sm leading-relaxed">{{ message.content }}</p>
        </div>
        <div class="flex justify-end mt-1">
          <span class="text-xs text-gray-500 dark:text-gray-400">{{ message.created_at }}</span>
        </div>
      </div>
    </div>
    
    <!-- Message reçu -->
    <div *ngIf="message.sender.id !== userId" class="flex-1 flex justify-start">
      <div class="max-w-xs lg:max-w-md">
        <div class="bg-white dark:bg-gray-700 text-gray-900 dark:text-white px-4 py-2 rounded-2xl rounded-bl-md shadow-sm border border-gray-200 dark:border-gray-600 message-bubble received">
          <p class="text-sm leading-relaxed">{{ message.content }}</p>
        </div>
        <div class="flex justify-start mt-1">
          <span class="text-xs text-gray-500 dark:text-gray-400">{{ message.created_at }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Messages en attente -->
  <div *ngFor="let msg of pendingMessages" class="flex justify-end">
    <div class="max-w-xs lg:max-w-md">
      <div class="bg-orange-600 text-white px-4 py-2 rounded-2xl rounded-br-md shadow-sm opacity-75">
        <p class="text-sm leading-relaxed">{{ msg.content }}</p>
        <div class="flex items-center justify-between mt-1">
          <span class="text-xs opacity-75">Envoi en cours...</span>
          <button 
            *ngIf="msg.error" 
            (click)="retryPendingMessages(msg)"
            title="Réessayer l'envoi"
            class="text-xs underline hover:no-underline">
            Réessayer
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- État vide -->
<div *ngIf="!chat" class="flex-1 flex items-center justify-center p-8">
  <div class="text-center">
    <div class="w-16 h-16 mx-auto mb-4 bg-orange-100 dark:bg-orange-900 rounded-full flex items-center justify-center">
      <svg class="w-8 h-8 text-orange-600 dark:text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
    </div>
    <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">Sélectionnez une conversation</h3>
    <p class="text-gray-500 dark:text-gray-400">Choisissez une conversation pour voir les messages</p>
  </div>
</div>
