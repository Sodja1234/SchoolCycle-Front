<!-- Liste des conversations -->
<div class="divide-y divide-gray-200 dark:divide-gray-700">
  <!-- Conversation -->
  <div *ngFor="let chat of chats" 
       (click)="chatSelected.emit(chat)" 
       class="p-4 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer chat-transition chat-hover">
    
    <div class="flex items-start space-x-3">
      <!-- Avatar -->
      <div class="flex-shrink-0">
        <div class="w-12 h-12 bg-gradient-to-br from-orange-400 to-orange-600 rounded-full flex items-center justify-center text-white font-semibold text-lg">
          {{ getInitials(getOtherParticipant(chat)) }}
        </div>
      </div>

      <!-- Contenu -->
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-900 dark:text-white truncate">
            {{ getOtherParticipant(chat) }}
          </h3>
          <span class="text-xs text-gray-500 dark:text-gray-400">
            {{ getLastMessageTime(chat) }}
          </span>
        </div>
        
        <p class="text-sm text-gray-600 dark:text-gray-300 truncate mt-1">
          {{ getLastMessageContent(chat) }}
        </p>
        
        <div class="flex items-center mt-2">
          <span class="text-xs text-orange-600 dark:text-orange-400 font-medium">
            {{ chat.posted_by.title }}
          </span>
          
          <!-- Indicateur de statut -->
          <div class="ml-auto flex items-center space-x-2">
            <!-- Indicateur si le chat est fermé -->
            <div *ngIf="chat.is_closed" class="flex items-center text-xs text-gray-500 dark:text-gray-400">
              <svg class="w-3 h-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
              Fermé
            </div>
            
            <!-- Indicateur de nouveaux messages (optionnel) -->
            <div *ngIf="!chat.is_closed" class="w-2 h-2 bg-orange-500 rounded-full"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- État vide -->
  <div *ngIf="chats.length === 0" class="p-8 text-center">
    <div class="w-16 h-16 mx-auto mb-4 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center">
      <svg class="w-8 h-8 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
    </div>
    <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">Aucune conversation</h3>
    <p class="text-gray-500 dark:text-gray-400">Commencez par contacter quelqu'un pour voir vos conversations ici</p>
  </div>
</div>
