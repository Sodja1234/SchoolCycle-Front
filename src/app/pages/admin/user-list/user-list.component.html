<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilisateurs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 h-full font-sans text-gray-700">
  <div class="flex h-full">
        <!-- Sidebar -->
    <app-sidebard></app-sidebard>
    <div class="flex-1 pr-30 pt-10 pl-30 space-y-6">
      <!-- Header -->
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">Utilisateurs</h1>
        <button class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">+ Ajouter un utilisateur</button>
      </div>

      <!-- Filtres principaux -->
      <div class="flex space-x-6 items-center border-b pb-2 mb-4 text-sm font-medium">
        <button class="text-orange-600 border-b-2 border-orange-600 pb-1">Tous les utilisateurs <span
            class="ml-1 bg-gray-200 px-2 py-0.5 rounded-full text-xs">0</span></button>
        <button class="text-green-600">Actifs <span class="ml-1 font-semibold">0</span></button>
        <button class="text-yellow-600">Inactifs <span class="ml-1 font-semibold">0</span></button>
        <button class="text-red-600">Suspendus <span class="ml-1 font-semibold">0</span></button>
      </div>

      <!-- Filtres avancés -->
      <div class="bg-white rounded shadow p-4 mb-6">
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 items-end">
          <div>
            <label class="text-sm text-gray-600">Rôle</label>
            <select class="w-full border rounded px-3 py-2 mt-1">
              <option>Tous les rôles</option>
            </select>
          </div>
          <div>
            <label class="text-sm text-gray-600">Date d'inscription</label>
            <select class="w-full border rounded px-3 py-2 mt-1">
              <option>Toutes les dates</option>
            </select>
          </div>
          <div>
            <label class="text-sm text-gray-600">Activité</label>
            <select class="w-full border rounded px-3 py-2 mt-1">
              <option>Toute activité</option>
            </select>
          </div>
          <div class="flex justify-end">
            <button class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600 mt-6">Appliquer les
              filtres</button>
          </div>
        </div>
      </div>

      <!-- Tableau des utilisateurs -->
      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
            <tr>
              <th class="p-3">Utilisateur</th>
              <th class="p-3">Rôle</th>
              <th class="p-3">Annonces</th>
              <th class="p-3">Date d'inscription</th>
              <th class="p-3">Dernière connexion</th>
              <th class="p-3">Statut</th>
              <th class="p-3">Actions</th>
            </tr>
          </thead>
          @for(user of users; track user.id){
          <tbody class="divide-y divide-gray-200">
            
            <tr>
              <td class="p-3 flex items-center space-x-2">
                <div
                  class="bg-gray-300 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold">
                  US</div>
                <div>
                  <div class="font-medium text-gray-800"> {{ user.name }} </div>
                  <div class="text-gray-500 text-xs"> {{ user.email}} </div>
                </div>
              </td>
              <td class="p-3"> {{ user.role }} </td>
              <td class="p-3"> {{ 0 }} </td>
              <td class="p-3"> {{ user.created_at }} </td>
              <td class="p-3">Il y a 2 heures</td>
              <td class="p-3">
                <span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-semibold">Actif</span>
              </td>
              <td class="p-3 space-x-2">
                <button class="text-blue-600 hover:text-blue-800">👁️</button>
                <button class="text-red-600 hover:text-red-800">🔐</button>
              </td>
            </tr>
          </tbody>
        }
        </table>
      </div>
    </div>
  </div>


</body>

</html>
