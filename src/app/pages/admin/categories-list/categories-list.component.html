<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">
  <div class="flex bg-gray-100 h-full">
    <!-- Sidebar -->
    <app-sidebard></app-sidebard>

    <!-- Main Content -->
    <main class="flex-1 pr-30 pt-10 pl-30 space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold">Toutes les categories</h2>
        <button class="bg-orange-500 text-white px-4 py-2 rounded">
          + Nouvelle categories
        </button>
      </div>
      
      <!-- Statistiques globales -->
      <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow">
        <h2 class="text-lg font-semibold text-gray-700">
          Total des catégories: <span class="text-orange-500 font-bold">0</span>
        </h2>
        <h2 class="text-lg font-semibold text-gray-700">
          Total des annonces: <span class="text-orange-500 font-bold">0</span>
        </h2>
      </div>

      <!-- Liste categories -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6 w-full">
        @for (category of categories; track category.id) {
        <app-categorie-card [categorie]="category"></app-categorie-card>
        }
      </div>
    </main>
  </div>
</body>

</html>
