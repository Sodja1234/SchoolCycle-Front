<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 h-full font-sans">
  <div class="flex bg-gray-100 ">
    <!-- Sidebar -->
    <app-sidebard></app-sidebard>

    <!-- Main Content -->
    <main class="flex-1 pr-30 pt-10 pl-30 space-y-6">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold">Signalements</h1>
      </div>

      <!-- Filtres principaux -->
      <div class="flex space-x-6 items-center border-b pb-2 mb-4 text-sm font-medium">
        <button class="text-orange-600 border-b-2 border-orange-600 pb-1">Tous les Signalements <span
            class="ml-1 bg-gray-200 px-2 py-0.5 rounded-full text-xs">0</span></button>
        <button class="text-green-600">En attente <span class="ml-1 font-semibold">0</span></button>
        <button class="text-yellow-600">Résolu <span class="ml-1 font-semibold">0</span></button>
      </div>

      <!-- Liste categories -->
      <div class="flex flex-col gap-4">
        @for (reports of report; track reports.id) {
        <app-report-card [report]="reports"></app-report-card>
        }
                                            <!-- Container de pagination qui s'affiche que si des liens existent -->
            <div class="mb-5 flex justify-center" *ngIf="paginationMeta?.links?.length">
                <nav aria-label="Page navigation">
                    <ul class="flex items-center -space-x-px h-8 text-sm">
                        <!-- Boucle sur chaque lien de pagination -->
                        <li *ngFor="let link of paginationMeta.links">
                            <!-- on desactive s'il y a pas d'url -->
                            <button [disabled]="!link.url" (click)="onPageChange(link.url)"
                                class="flex items-center justify-center px-3 h-8 leading-tight border transition-colors duration-200"
                                [ngClass]="{
                    'rounded-s-lg': link.label.includes('Previous'),
                    'rounded-e-lg': link.label.includes('Next'),
                    'text-white bg-[#FF8C00] border-[#FF8C00] hover:bg-[#FF9D1A] hover:border-[#FF9D1A]':
                      link.active,
                    'text-gray-600 bg-white border-gray-200 hover:bg-orange-50 hover:text-[#FF8C00]':
                      !link.active,
                    'cursor-not-allowed opacity-50': !link.url
                  }">
                                <span class="sr-only" *ngIf="link.label.includes('Previous')">Précédent</span>
                                <span class="sr-only" *ngIf="link.label.includes('Next')">Suivant</span>

                                <!-- On affiche le numero de la page  -->
                                <svg *ngIf="link.label.includes('Previous')" class="w-2.5 h-2.5 rtl:rotate-180"
                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="2" d="M5 1 1 5l4 4" />
                                </svg>

                                <!-- On affiche le numero de la page  -->
                                <svg *ngIf="link.label.includes('Next')" class="w-2.5 h-2.5 rtl:rotate-180"
                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                        stroke-width="2" d="m1 9 4-4-4-4" />
                                </svg>
                                <span [innerHTML]="link.label" *ngIf="
                      !link.label.includes('Previous') &&
                      !link.label.includes('Next')
                    "></span>
                            </button>
                        </li>
                    </ul>
                </nav>
            </div>
      </div>
    </main>

      </div>
</body>

</html>
